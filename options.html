<!DOCTYPE html>
<html>
<head><title>Forensic Logger Settings</title></head>
<body style="font-family: sans-serif; padding: 20px;">
  <h2>Forensic Logger Configuration</h2>
  <p>Since browser extensions cannot run bash commands, please enter your hostname:</p>
  <label>Hostname (equivalent to <code>uname -n | cut -d. -f1</code>):</label>
  <input type="text" id="hostname" style="margin-left: 10px;" />
  <button id="save">Save</button>
  <p id="status" style="color: green;"></p>
</body>
<script src="options.js"></script>
</html>
